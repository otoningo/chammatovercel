<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>inglatam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220;
    --surface:#121B2E;
    --text:#E6EDF3;
    --muted:#8B98A8;
    --accent:#4FD1C5;
    --border:#22304A;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(79,209,197,0.06), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 28px;
  }
  .brand{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.1em;
    color:var(--accent);
  }
  nav a{
    font-family:var(--mono);
    font-size:13px;
    color:var(--muted);
    text-decoration:none;
    border:1px solid var(--border);
    padding:7px 14px;
    border-radius:8px;
    transition:border-color .15s, color .15s;
  }
  nav a:hover{border-color:var(--accent);color:var(--accent);}
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    max-width:560px;
    padding:20px 28px 60px;
  }
  h1{
    font-size:clamp(28px, 5vw, 40px);
    line-height:1.25;
    margin:0 0 16px;
  }
  p{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    margin:0;
  }
  footer{
    padding:20px 28px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
  }
</style>
</head>
<body>
  <header>
    <span class="brand">◆ otoningo.dev</span>
    <nav><a href="/chat">Entrar</a></nav>
  </header>
  <main>
    <h1>Sitio personal en construcción.</h1>
    <p>Por ahora no hay mucho que ver aquí — vuelve pronto.</p>
  </main>
  <footer>&copy; 2026</footer>
</body>
</html>
